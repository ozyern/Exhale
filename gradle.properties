## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

# Tuned for high-end hardware: big heaps + G1 with larger regions keeps GC pauses
# out of Kotlin/KSP compilation; metaspace cap avoids daemon bloat over long sessions.
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx6144M -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
org.gradle.configuration-cache=true
org.gradle.unsafe.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.nonTransitiveRClass=false

# Jetifier is disabled - no need for ignorelist

# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads (fixes timeout issues with NewPipeExtractor)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Local build cache: reuses task outputs across builds/branches — the single biggest
# incremental-build win. (Was disabled over a SNAPSHOT-download timeout concern, but the
# LOCAL cache never touches the network; the JitPack timeouts above cover downloads.)
org.gradle.caching=true

# Fix KSP IllegalStateException: Storage for [...] is already registered
ksp.incremental=false

# R8 full mode — the most aggressive shrinking/optimization pass (dead-code
# elimination, class merging, inlining, more precise devirtualization). Maximizes
# runtime performance and minimizes APK size / lag in release builds.
android.enableR8.fullMode=true

# Silence the "AGP tested up to compile SDK 36.1" nag for compileSdk 37.
android.suppressUnsupportedCompileSdk=37.0
